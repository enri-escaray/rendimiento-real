name: CI

# Corre en cada push a main y en cada pull request. Detecta si un cambio
# rompe el lint, los tipos o los tests antes de que llegue a producción.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
